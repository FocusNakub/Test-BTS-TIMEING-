name: Update rail service alerts

on:
  schedule:
    # Asia/Bangkok: every 15 minutes from 05:00–00:30; pause 00:45–04:45.
    - cron: "*/15 22 * * *"
    - cron: "*/15 23,0-16 * * *"
    - cron: "0,15,30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rail-service-alerts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check official-source news
        run: node scripts/update-service-alerts.mjs
      - name: Publish changed alerts
        run: |
          if git diff --quiet -- public/service-alerts.json service-alerts.json; then
            echo "No alert change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/service-alerts.json service-alerts.json
          git commit -m "Update rail service alerts"
          git push
