name: Manual push test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check token is not empty
        env:
          ALERT_UPDATE_TOKEN: ${{ secrets.ALERT_UPDATE_TOKEN }}
        run: |
          if [ -z "$ALERT_UPDATE_TOKEN" ]; then
            echo "::error::ALERT_UPDATE_TOKEN is EMPTY in this job context"
            exit 1
          fi
          echo "Token length: ${#ALERT_UPDATE_TOKEN} characters"
      - name: Send test push
        env:
          ALERT_UPDATE_TOKEN: ${{ secrets.ALERT_UPDATE_TOKEN }}
        run: |
          curl -X POST "https://bangkok-rail-daily-2026.pp5074160.chatgpt.site/api/push/test" \
            -H "Authorization: Bearer $ALERT_UPDATE_TOKEN" \
            --fail --silent --show-error
